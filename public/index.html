<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cosplaygram</title>
  <meta name="description" content="Cosplaygram — платформа для косплееров Казахстана и Центральной Азии: костюмы, процесс шитья, форум, календарь конкурсов и чат.">
  <meta name="theme-color" content="#B8317F">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Навигация">
      <a href="#/" class="logo">Cosplay<span>gram</span></a>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <header class="topbar">
      <a href="#/" class="logo">Cosplay<span>gram</span></a>
      <div class="topbar-actions" id="topActions"></div>
    </header>

    <main class="main" id="view" tabindex="-1"></main>

    <aside class="rail" id="rail" aria-label="Конкурс и события"></aside>

    <nav class="bottombar" id="bottomNav" aria-label="Навигация"></nav>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
