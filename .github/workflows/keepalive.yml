name: Проверка, что сайт работает

# Сайт живёт на своём сервере в Казахстане и не засыпает.
# Раз в час проверяем, что https://cosplaygram.kz отвечает; если нет — проверка падает и GitHub присылает письмо.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 30 https://cosplaygram.kz/healthz
