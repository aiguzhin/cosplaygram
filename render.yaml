databases:
  - name: cosplaygram-db
    plan: free
    databaseName: cosplaygram
    user: cosplaygram

services:
  - type: web
    name: cosplaygram
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: cosplaygram-db
          property: connectionString
