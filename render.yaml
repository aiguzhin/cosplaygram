# На Render работает только пересылка старого адреса cosplaygram.onrender.com на cosplaygram.kz.
# Сам сайт и база — на своём сервере в Казахстане (папка deploy/). База на Render не нужна.
services:
  - type: web
    name: cosplaygram
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
